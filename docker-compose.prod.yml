# Production stack for a single server.
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy (web) is exposed to the internet; the API and database are internal.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groovelog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-groovelog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groovelog} -d ${POSTGRES_DB:-groovelog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-groovelog}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-groovelog}
      JWT_ACCESS_KEY: ${JWT_ACCESS_KEY:?set JWT_ACCESS_KEY in .env.prod}
      JWT_REFRESH_KEY: ${JWT_REFRESH_KEY:?set JWT_REFRESH_KEY in .env.prod}
      FLASK_ENV: production
      ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in .env.prod}
      # Caddy is the one proxy in front, so trust one hop of X-Forwarded-For
      TRUSTED_PROXY_HOPS: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
